name: vertix-funcionarios

# Ambiente local, espelhando a produção (Render + Neon) com um Postgres em container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vertix_funcionarios
      POSTGRES_USER: ${DB_USER:-vertix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vertix123}
      TZ: America/Manaus
    ports:
      - "5433:5432"   # acesso local (DBeaver, pgAdmin) em localhost:5433 (5432 costuma estar em uso)
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-vertix}:${DB_PASSWORD:-vertix123}@db:5432/vertix_funcionarios
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo}
      APP_TIMEZONE: America/Manaus
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SEED_DEMO: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        REACT_APP_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pg_data:
